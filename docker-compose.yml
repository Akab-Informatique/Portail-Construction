services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frx}
      POSTGRES_USER: ${POSTGRES_USER:-frx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - frx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: frx-portal:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_DB: ${POSTGRES_DB:-frx}
      POSTGRES_USER: ${POSTGRES_USER:-frx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-frx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frx}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Session cookies get the Secure flag unless COOKIE_INSECURE=1 (only for plain http://<ip>:8080 testing).
      COOKIE_INSECURE: ${COOKIE_INSECURE:-0}

volumes:
  frx_pgdata:
